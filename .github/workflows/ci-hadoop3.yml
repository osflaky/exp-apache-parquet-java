name: CI Hadoop 3

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - java: {setup: '17', maven: '17'}
          os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    name: Build Parquet with JDK ${{ matrix.java.setup }} [${{ 
      matrix.expander_leg }}]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - name: Set up JDK ${{ matrix.java.setup }}
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c   # v6.0.0
      with:
        distribution: temurin
        java-version: ${{ matrix.java.setup }}
    - name: before_install
      env:
        CI_TARGET_BRANCH: $GITHUB_HEAD_REF
      run: |
        bash dev/ci-before_install.sh
    - name: install
      run: |
        ./mvnw install --batch-mode -DskipTests=true -Dmaven.javadoc.skip=true -Dsource.skip=true -Djava.version=${{ matrix.java.maven }}
    - name: verify
      env:
        TEST_CODECS: 'uncompressed,brotli,gzip,snappy,zstd'
        JAVA_VERSION: ${{ matrix.java.setup }}
      run: |
        ./mvnw verify --batch-mode javadoc:javadoc
    - name: generate published JARs and verify LICENSE and NOTICE
      if: matrix.java.setup == '17'
      run: |
        # Ensure all JARs published by the release are created before checking LICENSE and NOTICE.
        ./mvnw --batch-mode process-resources source:jar-no-fork javadoc:jar
        # Verify every published JAR contains LICENSE and NOTICE.
        ./dev/check-jar-license-and-notice.sh
    timeout-minutes: 150
